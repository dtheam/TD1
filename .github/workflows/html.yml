name: Deploy Page HTML

# Se déclenche à chaque push sur la branche main
on:
  push:
    branches:
      - main

# Autorisations nécessaires pour que le script puisse publier le site
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    # Déclare que ce job déploie vers l'environnement "github-pages"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v4

      - name: Préparer les fichiers (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # Point "." signifie qu'on prend tout le dossier racine (là où est index.html)
          path: '.'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4