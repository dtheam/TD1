name: Pipeline - Déploiement depuis Docker Image

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1er JOB : Extraire le fichier de l'image Docker
  extract-html:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Créer le dossier de destination local
        run: mkdir site_web
        
      - name: Démarrer un conteneur temporaire en arrière-plan
        run: docker run -d --name temp-container ${{ secrets.DOCKER_USERNAME }}/hello-world-app:latest
        
      - name: Extraire le fichier HTML du conteneur vers le Runner
        # La commande "docker cp" permet de copier des fichiers d'un conteneur vers la machine hôte
        run: docker cp temp-container:/usr/share/nginx/html/index.html ./site_web/index.html
        
      - name: Nettoyer le conteneur temporaire
        run: docker rm -f temp-container
        
      - name: Sauvegarder le dossier en tant qu'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site_web'

  # 2ème JOB : Déployer l'artefact sur GitHub Pages
  deploy-pages:
    needs: extract-html
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4